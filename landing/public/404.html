<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — InboxFly</title>
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..1000&display=swap" rel="stylesheet">
<script>try{var m=localStorage.getItem('site-mode');document.documentElement.dataset.mode=m||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}catch(e){}</script>
<link rel="stylesheet" href="/assets/style.css?v=14">
<style>
  body { display:grid; place-items:center; min-height:100vh; }
  .nf { text-align:center; padding:32px 24px; max-width:520px; }
  .nf img { height:44px; width:auto; margin-bottom:34px; }
  .nf h1 { font-size:72px; font-weight:800; letter-spacing:-.03em; line-height:1;
    background:linear-gradient(135deg,var(--brand),var(--coral)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .nf .t { font-size:19px; font-weight:700; margin:14px 0 6px; }
  .nf .d { color:var(--text-2); font-size:14px; line-height:1.7; margin-bottom:30px; }
  .nf .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .nf .btns a { display:inline-flex; align-items:center; gap:8px; }
  .nf-mail { margin-top:26px; font-size:13px; color:var(--text-2); }
  .nf-mail a { color:var(--brand); text-decoration:underline; text-underline-offset:2px; }
  @media (max-width:640px){ .nf h1{font-size:56px;} }
</style>
</head>
<body>
<div class="nf">
  <img src="/assets/logo.svg" alt="InboxFly">
  <h1>404</h1>
  <p class="t" id="t">页面未找到</p>
  <p class="d" id="d">你访问的页面不存在或已被移动。试试从下面几个入口继续。</p>
  <div class="btns">
    <a class="btn btn-primary" id="b-home" href="/zh/self-hosted">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/></svg>
      <span id="b1">返回 InboxFly</span>
    </a>
    <a class="btn btn-ghost" href="/zh/articles">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
      <span id="b2">文章</span>
    </a>
    <a class="btn btn-ghost" href="/zh/self-hosted#faq">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
      <span id="b3">常见问题</span>
    </a>
    <a class="btn btn-ghost" href="https://panel.inboxfly.email" target="_blank" rel="noopener">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      <span id="b4">打开面板</span>
    </a>
  </div>
  <p class="nf-mail" id="mail">需要帮助？<a href="mailto:support@inboxfly.email">support@inboxfly.email</a></p>
</div>
<script>
(function(){
  if(!/\/zh\//.test(location.pathname)){
    document.querySelector('#t').textContent='Page not found';
    document.querySelector('#d').textContent='The page you are looking for does not exist or has moved. Try one of these instead.';
    document.querySelector('#b1').textContent='Back to InboxFly';
    document.querySelector('#b2').textContent='Articles';
    document.querySelector('#b3').textContent='FAQ';
    document.querySelector('#b4').textContent='Open panel';
    document.querySelector('#mail').innerHTML='Need help? <a href="mailto:support@inboxfly.email">support@inboxfly.email</a>';
    document.querySelector('#b-home').href='/self-hosted';
    document.querySelectorAll('.btns a')[1].href='/articles';
    document.querySelectorAll('.btns a')[2].href='/self-hosted#faq';
  }
})();
</script>
</body>
</html>
